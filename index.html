<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイックタスク</title>
  <meta name="description" content="納期が近い順に自動で並ぶ、見やすいタスク管理アプリ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- キーボードで最初にたどり着く「本文へスキップ」リンク -->
  <a class="skip-link" href="#main">本文へスキップ</a>

  <div class="app">
    <header class="app-header">
      <h1 class="app-title"><span class="title-full">クイックタスク</span><span class="title-short">TASK</span></h1>
      <button type="button" class="btn-ghost" id="manageCategoriesBtn" aria-haspopup="dialog">ジャンル管理</button>
    </header>

    <main id="main">
      <!-- 追加フォーム -->
      <section class="card add-card" aria-labelledby="add-heading">
        <h2 id="add-heading" class="section-label">新しいタスクを追加</h2>
        <form id="addForm" class="add-form" autocomplete="off">
          <div class="field">
            <label for="titleInput" class="field-label">やること</label>
            <input type="text" id="titleInput" name="title" class="input input-title"
                   placeholder="例：企画書を提出する" required aria-describedby="titleHint">
            <p id="titleHint" class="field-hint">Enterキーでも追加できます</p>
          </div>

          <!-- 備考（任意）：ふだんは閉じておき、必要なときだけ開いて書く -->
          <div class="field field-note-toggle">
            <button type="button" id="noteToggle" class="btn-note-toggle"
                    aria-expanded="false" aria-controls="noteField">＋ 備考（任意）</button>
          </div>
          <div class="field" id="noteField" hidden>
            <label for="noteInput" class="field-label">備考（任意）</label>
            <textarea id="noteInput" name="note" class="input input-note" rows="2"
                      placeholder="詳細メモがあれば記入（あとから追加・編集もできます）"></textarea>
          </div>

          <div class="add-form-row">
            <div class="field">
              <label for="dueInput" class="field-label">納期</label>
              <input type="date" id="dueInput" name="due" class="input">
            </div>
            <div class="field">
              <label for="categoryInput" class="field-label">ジャンル</label>
              <select id="categoryInput" name="category" class="input"></select>
            </div>
            <div class="field field-submit">
              <button type="submit" class="btn-primary">追加する</button>
            </div>
          </div>
        </form>
      </section>

      <!-- ジャンル絞り込み -->
      <nav class="filters" aria-label="ジャンルで絞り込み">
        <div class="filters-scroll" id="filterTabs" role="group" aria-label="ジャンル"></div>
      </nav>

      <!-- 一覧の見出しと件数 -->
      <div class="list-head">
        <h2 class="section-label" id="list-heading" tabindex="-1">タスク一覧</h2>
        <span class="count" id="taskCount"></span>
      </div>

      <!-- タスク一覧（中身はJSで生成）-->
      <ul class="task-list" id="taskList" aria-labelledby="list-heading"></ul>
      <p class="empty" id="emptyState" hidden>該当するタスクはありません</p>
    </main>

    <!-- 画面には出さない、読み上げ専用の状況通知 -->
    <div class="visually-hidden" role="status" aria-live="polite" id="liveRegion"></div>
  </div>

  <!-- ジャンル管理ダイアログ（HTML標準の <dialog>：Escで閉じる・フォーカス管理も自動）-->
  <dialog id="categoryDialog" class="dialog" aria-labelledby="catDialogTitle">
    <div class="dialog-inner">
      <div class="dialog-head">
        <h2 id="catDialogTitle">ジャンル管理</h2>
        <button type="button" class="btn-icon" id="catCloseBtn" aria-label="閉じる">✕</button>
      </div>
      <form class="cat-add-row" id="catForm">
        <label for="newCatInput" class="visually-hidden">新しいジャンル名</label>
        <input type="text" id="newCatInput" class="input" placeholder="新しいジャンル名" required>
        <button type="submit" class="btn-primary">追加</button>
      </form>
      <ul class="cat-list" id="catList"></ul>
    </div>
  </dialog>

  <!-- まず store.js（データ係）、次に app.js（画面係）の順で読み込む -->
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
